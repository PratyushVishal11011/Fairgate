
services:
  fairgate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fairgate-server
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - fairgate_wal:/app/data
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: fairgate-clickhouse
    environment:
      CLICKHOUSE_USER: fairgate
      CLICKHOUSE_PASSWORD: fairgate_dev_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: fairgate-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: fairgate-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  fairgate_wal:
  clickhouse_data:
  prometheus_data:
  grafana_data:


services:
  fairgate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fairgate-server
    environment:
      FAIRGATE_CONFIG: /etc/fairgate/fairgate.yaml
      FAIRGATE_CHECKPOINT_PATH: /app/data/checkpoint.json
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: fairgate
      CLICKHOUSE_USER: fairgate
      CLICKHOUSE_PASSWORD: fairgate_dev_password
    ports:
      - "9001:9001"
      - "9100:9100"
    volumes:
      - fairgate_wal:/app/data
      - ./deploy/fairgate.yaml:/etc/fairgate/fairgate.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    # Covers server.shutdown_grace_period plus server.drain_timeout before Docker sends SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: fairgate-clickhouse
    environment:
      CLICKHOUSE_USER: fairgate
      CLICKHOUSE_PASSWORD: fairgate_dev_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD
        - clickhouse-client
        - --user
        - fairgate
        - --password
        - fairgate_dev_password
        - --query
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: fairgate-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: fairgate-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    container_name: fairgate-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  fairgate_wal:
  clickhouse_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

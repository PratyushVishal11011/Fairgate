# FairGate configuration.
#
# Pass this file with `fairgate -config path/to/fairgate.yaml` or FAIRGATE_CONFIG=path/to/fairgate.yaml.
# Every setting is optional: anything left out keeps the default shown here, and unknown keys are
# rejected so a misspelled setting fails at startup instead of being ignored.
#
# These environment variables override the file, which keeps secrets and per-host values out of it:
#   FAIRGATE_METRICS_ADDR     server.metrics_addr
#   FAIRGATE_CHECKPOINT_PATH  shipper.checkpoint_path
#   CLICKHOUSE_ADDR           clickhouse.addr (comma-separated for several addresses)
#   CLICKHOUSE_DATABASE       clickhouse.database
#   CLICKHOUSE_USER           clickhouse.username
#   CLICKHOUSE_PASSWORD       clickhouse.password
#
# Durations use Go syntax, for example 500ms, 5s, or 1m30s.

server:
  # TCP address for event ingestion. In Docker Compose, keep the published port in step with it.
  listen_addr: ":9001"
  # HTTP address for /health and /metrics. Compose, its healthcheck, and Prometheus expect port 9100.
  metrics_addr: ":9100"
  # Time active handlers get to finish on shutdown before their connections are closed.
  shutdown_grace_period: 5s

admission:
  # Token-bucket limit per producer: refill rate in events per second, and bucket capacity.
  rate: 500
  burst: 1000

queues:
  # Events buffered per producer before enqueueing blocks and applies backpressure.
  capacity: 512

scheduler:
  # Maximum events served from one producer queue per DRR visit.
  quantum: 8

wal:
  # Path of the first WAL segment. Later segments are created next to it.
  # Relative paths resolve against the working directory (/app in the Docker image).
  path: data/fairgate.wal
  # Segment size in bytes before the writer rotates. Shipped segments are reclaimed whole,
  # so smaller segments free disk space sooner. 67108864 is 64 MiB.
  segment_size: 67108864

shipper:
  # Where the shipper keeps its delivery position. Keep it on the same persistent volume as the WAL.
  checkpoint_path: data/checkpoint.json
  # Maximum events per ClickHouse insert.
  batch_size: 200
  # How often the shipper checks for new durable WAL records once it has caught up.
  poll_interval: 1s
  # Failed inserts are retried until they succeed, with capped exponential backoff.
  retry:
    initial_delay: 1s
    max_delay: 30s
    multiplier: 2
    # Symmetric jitter as a fraction of each delay, between 0 and 1.
    jitter: 0.2

clickhouse:
  # One or more ClickHouse native-protocol addresses.
  addr:
    - localhost:9000
  database: fairgate
  username: fairgate
  # Prefer CLICKHOUSE_PASSWORD over storing the password in this file.
  # password: fairgate_dev_password

log:
  # One of debug, info, warn, error.
  level: info

# FairGate configuration.
#
# Pass this file with `fairgate -config path/to/fairgate.yaml` or FAIRGATE_CONFIG=path/to/fairgate.yaml.
# Every setting is optional: anything left out keeps the default shown here, and unknown keys are
# rejected so a misspelled setting fails at startup instead of being ignored.
#
# These environment variables override the file, which keeps secrets and per-host values out of it:
#   FAIRGATE_METRICS_ADDR     server.metrics_addr
#   FAIRGATE_CHECKPOINT_PATH  shipper.checkpoint_path
#   CLICKHOUSE_ADDR           clickhouse.addr (comma-separated for several addresses)
#   CLICKHOUSE_DATABASE       clickhouse.database
#   CLICKHOUSE_USER           clickhouse.username
#   CLICKHOUSE_PASSWORD       clickhouse.password
#
# Durations use Go syntax, for example 500ms, 5s, or 1m30s.

server:
  # TCP address for event ingestion. In Docker Compose, keep the published port in step with it.
  listen_addr: ":9001"
  # HTTP address for /health and /metrics. Compose, its healthcheck, and Prometheus expect port 9100.
  metrics_addr: ":9100"
  # Time active handlers get to finish on shutdown before their connections are closed.
  shutdown_grace_period: 5s
  # Then time to empty the producer queues and ship every WAL record to ClickHouse before exiting.
  # Whatever is left stays in the WAL and is shipped after the next start. 0 skips the drain.
  drain_timeout: 10s
  # Largest frame accepted, in bytes, counting the type and flags bytes (1 KiB to 64 MiB).
  # A larger frame is skipped and answered invalid / frame_too_large. Events over the WAL's
  # 1 MiB record limit are refused as payload_too_large whatever this is.
  max_frame_bytes: 5242880
  # Close a connection that starts no new frame for this long. 0 keeps idle producers connected.
  idle_timeout: 0s
  # Time to receive the rest of a frame once its first byte arrives; stalled frames close the connection.
  frame_timeout: 30s
  # Time to write one ACK; a client that stops reading ACKs is disconnected.
  write_timeout: 10s
  # Accept clients that send events without first sending a hello frame (protocol version 0,
  # the original unversioned protocol). Set false once every producer negotiates a version.
  allow_legacy_clients: true

admission:
  # Token-bucket limit per producer: refill rate in events per second, and bucket capacity.
  rate: 500
  burst: 1000

queues:
  # Events buffered per producer. New events are refused once a queue reaches overload.queue_high_water.
  capacity: 512

scheduler:
  # Events served per DRR round to a producer of weight 1. A producer of weight w gets quantum * w.
  quantum: 8

fairness:
  # DRR weight for producers that have no entry under `producers`.
  default_weight: 1
  # Per-producer overrides, keyed by producer_id. Each field is optional; an omitted field keeps the
  # default above (admission.rate, admission.burst, queues.capacity, fairness.default_weight).
  #   weight          share of each scheduling round relative to other producers (fractions allowed)
  #   rate, burst     admission token-bucket limit for this producer
  #   queue_capacity  events buffered for this producer before enqueueing blocks
  # Listed producers also get their own `producer` label in metrics; all others are reported as
  # "other". To monitor a producer without changing its limits, list it with no fields: `my-producer: {}`.
  # producers:
  #   payments-service:
  #     weight: 4
  #     rate: 2000
  #     burst: 4000
  #     queue_capacity: 2048
  #   batch-importer:
  #     weight: 0.25
  #     rate: 100

overload:
  # New events are refused with a retryable `rejected` ACK before they reach the WAL once a backlog
  # builds up. The ACK message names the backlog. Set a limit to 0 to disable that check.
  # Refuse a producer's events once its own queue is this full, from 0 to 1. Below 1 it leaves headroom
  # for events already being appended, which otherwise wait for queue space without an ACK.
  queue_high_water: 0.9
  # Events queued across all producers. Past it, only producers holding more than their weighted share
  # of this total are refused, so a light producer is not held back by a heavy one.
  max_queued_events: 100000
  # Durable WAL bytes not yet delivered to ClickHouse (1 GiB). Past it, every new event is refused
  # until delivery catches up, which bounds WAL disk use during a ClickHouse outage.
  max_shipper_lag_bytes: 1073741824
  # A gateway-wide limit clears once its backlog drops below this fraction of it.
  resume_ratio: 0.8
  # How often the gateway-wide backlogs are sampled.
  sample_interval: 100ms

wal:
  # Path of the first WAL segment. Later segments are created next to it.
  # Relative paths resolve against the working directory (/app in the Docker image).
  path: data/fairgate.wal
  # Segment size in bytes before the writer rotates. Shipped segments are reclaimed whole,
  # so smaller segments free disk space sooner. 67108864 is 64 MiB.
  segment_size: 67108864
  # What startup does with damaged records the shipper has not delivered yet. "refuse" stops
  # startup so you can run "fairgate wal inspect"; "quarantine" copies the segment to
  # quarantine/, cuts it at the damage, and starts. A torn final record, or damage to records
  # already shipped, is handled automatically either way.
  on_corruption: refuse
  # If a write or fsync fails and moving to a fresh segment fails too, the gateway refuses events
  # (rejected / storage_unavailable) and reports not ready. After this long it exits with status 3
  # so a supervisor can restart it. 0 never exits.
  degraded_exit_after: 1m

shipper:
  # Where the shipper keeps its delivery position. Keep it on the same persistent volume as the WAL.
  checkpoint_path: data/checkpoint.json
  # Maximum events per ClickHouse insert.
  batch_size: 200
  # How often the shipper checks for new durable WAL records once it has caught up.
  poll_interval: 1s
  # Failed inserts are retried until they succeed, with capped exponential backoff.
  retry:
    initial_delay: 1s
    max_delay: 30s
    multiplier: 2
    # Symmetric jitter as a fraction of each delay, between 0 and 1.
    jitter: 0.2

clickhouse:
  # One or more ClickHouse native-protocol addresses.
  addr:
    - localhost:9000
  database: fairgate
  username: fairgate
  # Prefer CLICKHOUSE_PASSWORD over storing the password in this file.
  # password: fairgate_dev_password

log:
  # One of debug, info, warn, error.
  level: info

profiling:
  # Serve Go's net/http/pprof endpoints under /debug/pprof/ on their own listener.
  # Off by default: profiles expose internals, and collecting them costs CPU.
  enabled: false
  # Keep this on loopback unless you restrict access some other way. In a container, use ":6060"
  # and publish it to the host's loopback only, for example "127.0.0.1:6060:6060".
  addr: "127.0.0.1:6060"
  # Block and mutex profiles are empty unless sampling is turned on. Both cost CPU while enabled.
  # block_profile_rate: one sample per this many nanoseconds spent blocked (1 records everything).
  # mutex_profile_fraction: sample one in this many contention events (1 records everything).
  block_profile_rate: 0
  mutex_profile_fraction: 0
